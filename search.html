<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search this site</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Lato%3A300%2C300italic%2C400%2C400italic%2C700%2C700italic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/search-index.js" defer></script>
<script src="assets/js/search.js" defer></script>
</head>
<body class="search-page">

<div class="search-shell">

  <!-- back arrow, outside the card, as on the original -->
  <button class="search-back" type="button" id="searchBack" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
    </svg>
  </button>

  <div class="search-main">

    <!-- ------------------------------------------------- search bar -->
    <form class="search-bar" id="searchForm" role="search">
      <span class="search-bar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
      </span>
      <label class="sr-only" for="searchInput">Search this site</label>
      <input type="search" id="searchInput" name="query" autocomplete="off" spellcheck="false"
             placeholder="Search this site" aria-controls="searchResults">
      <button class="search-clear" type="button" id="searchClear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </form>

    <!-- --------------------------------------------------- results -->
    <div class="search-card" id="searchCard" hidden>
      <p class="search-card-head">Results from this site</p>
      <div id="searchResults" role="region" aria-live="polite" aria-label="Search results"></div>
    </div>

    <p class="search-empty" id="searchEmpty" hidden></p>

  </div>
</div>

</body>
</html>
